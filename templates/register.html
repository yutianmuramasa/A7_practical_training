<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>注册</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .register-container {
      max-width: 550px;
      margin: 60px auto;
      padding: 30px;
      background-color: #f8f9fa;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body>
<div class="container">
  <div class="register-container">
    <h3 class="mb-4 text-center">注册</h3>
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">用户名</label>
        <input name="username" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">密码</label>
        <input name="password" type="password" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">身份</label>
        <select name="role" class="form-select" required>
          <option value="student">学生</option>
          <option value="teacher">教师</option>
          <option value="admin">管理员</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">学号或工号</label>
        <input name="user_number" type="text" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-success w-100">注册</button>
    </form>
    <div class="mt-3 text-center">
      <p>已有账号？<a href="/login">去登录</a></p>
    </div>
  </div>
</div>
</body>
</html>
