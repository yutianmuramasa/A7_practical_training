<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>回答结果</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .answer-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 35px;
            background-color: #f8f9fa;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }
        .answer-panel {
            background: white;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #e0e3e7;
            margin-bottom: 25px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.03);
        }
        .section-title {
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f2f5;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title i {
            font-size: 1.3rem;
            color: #4e73df;
        }
        .question-content, .answer-content {
            padding: 15px;
            background-color: #fafbff;
            border-radius: 6px;
            border-left: 4px solid #e0e7ff;
            margin-bottom: 25px;
            line-height: 1.7;
        }
        .answer-content {
            white-space: pre-wrap;
            background-color: #f8fafc;
            border-left: 4px solid #d6e4ff;
        }
        .back-link {
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="answer-container">
        <div class="answer-panel">
            <h2 class="section-title">
                <i class="bi bi-question-circle"></i>你的问题
            </h2>
            <div class="question-content">
                {{ question }}
            </div>

            <h2 class="section-title">
                <i class="bi bi-robot"></i>AI 的回答
            </h2>
            <div class="answer-content">
                {{ answer }}
            </div>
        </div>

        <div class="back-link">
            <a href="/student/ask" class="btn btn-outline-primary">
                <i class="bi bi-arrow-left"></i> 返回问答页面
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
