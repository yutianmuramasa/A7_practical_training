<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>题库查看与筛选</title>
  <style>
    body {
      font-family: 'Microsoft YaHei', sans-serif;
      background-color: #f5f5f5;
      padding: 40px 20px;
    }
      h2 {
      margin-bottom: 20px;
      color: #333;
      text-align: center;
    }
    form {
      margin-bottom: 20px;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      max-width: 1000px;
      margin-left: auto;
      margin-right: auto;
    }
    select, input[type="text"], button {
      padding: 8px 12px;
      margin-right: 12px;
      margin-bottom: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    table {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      background-color: white;
      border-collapse: collapse;
      box-shadow: 0 0 6px rgba(0,0,0,0.05);
    }
    th, td {
      padding: 12px;
      border: 1px solid #ddd;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }
    th {
      background-color: #f0f0f0;
    }
    .action-btn {
      margin-right: 8px;
      text-decoration: none;
      font-weight: bold;
    }
    .edit-btn {
      color: #007bff;
    }
    .delete-btn {
      color: #dc3545;
    }
    .back {
      text-align: center;
      margin: 30px 0;
    }
    .back a {
      display: inline-block;
      padding: 8px 16px;
      background-color: #6c757d;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
    }
    .back a:hover {
      background-color: #5a6268;
    }
    .back-btn {
      background-color: #6c757d;
      color: white;
      padding: 8px 16px;
      text-decoration: none;
      border-radius: 6px;
      font-size: 14px;
    }
    .back-btn:hover {
      background-color: #5a6268;
    }


  </style>
</head>
<body>

<h2> 我的题库</h2>

<form method="get" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; justify-content: flex-start;">
  <label>课程：</label>
  <select name="course">
    <option value="">全部课程</option>
    {% for course in courses %}
    <option value="{{ course }}" {% if selected_course == course %}selected{% endif %}>{{ course }}</option>
    {% endfor %}
  </select>

  <label>题型：</label>
  <select name="type">
    <option value="">全部题型</option>
    {% for t in types %}
    <option value="{{ t }}" {% if selected_type == t %}selected{% endif %}>{{ t }}</option>
    {% endfor %}
  </select>

  <label>关键词：</label>
  <input type="text" name="keyword" placeholder="题干 / 答案 / 解析" value="{{ keyword }}">

  <button type="submit">筛选</button>

  <!-- 这里新增返回按钮 -->
  <a href="/teacher" class="back-btn">返回教师首页</a>
</form>


<table>
  <thead>
  <tr>
    <th>题干</th>
    <th>答案</th>
    <th>解析</th>
    <th>课程</th>
    <th>题型</th>
    <th>设计时间</th>
    <th>修正耗时</th>
    <th>操作</th>
  </tr>
  </thead>
  <tbody>
  {% for q in questions %}
  <tr>
    <td>{{ q[1] }}</td>
    <td>{{ q[2] }}</td>
    <td>{{ q[3] }}</td>
    <td>{{ q[5] }}</td>
    <td>{{ q[4] }}</td>
    <td>{{ q[6] }}</td>
    <td>{{ q[7] or 0 }} 秒</td>
    <td>
      <a href="/teacher/edit_question/{{ q[0] }}" class="action-btn edit-btn">编辑</a>
      <a href="/teacher/delete_question/{{ q[0] }}" class="action-btn delete-btn" onclick="return confirm('确认删除该题目？');">删除</a>
    </td>
  </tr>
  {% endfor %}
  </tbody>
</table>

</body>
</html>
