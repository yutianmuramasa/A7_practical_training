<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>编辑题目</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            编辑题目（ID: {{ question.id }}）
        </div>
        <div class="card-body">
            <div class="alert alert-info" id="timer">
                 正在计时中：<span id="elapsed">0</span> 秒
            </div>

            <script>
                let seconds = 0;
                const elapsedSpan = document.getElementById('elapsed');

                function updateTimer() {
                    elapsedSpan.innerText = ++seconds;
                }

                setInterval(updateTimer, 1000);
            </script>

            <form method="post" action="/teacher/update_question">
                <input type="hidden" name="id" value="{{ question.id }}">
                <input type="hidden" name="from_url" value="{{ from_url }}">

                <div class="mb-3">
                    <label class="form-label">题目内容</label>
                    <textarea name="question" class="form-control" rows="10" required>{{ question.question }}</textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">参考答案</label>
                    <textarea name="answer" class="form-control" rows="3">{{ question.answer }}</textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">解析</label>
                    <textarea name="explanation" class="form-control" rows="3">{{ question.explanation }}</textarea>
                </div>

                <div class="d-flex justify-content-between">
                    <button type="submit" class="btn btn-success">保存修改</button>
                    <a href="{{ from_url or '/teacher/question_bank' }}" class="btn btn-secondary">取消返回</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
